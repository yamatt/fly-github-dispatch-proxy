# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
      - "*.py"
  workflow_run:
    workflows:
      - Auto-merge
    types:
      - completed
jobs:
  fly-config-validate:
    name: Validate Fly.io config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate config
        run: flyctl config validate  --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  python-lint:
    name: Run Python linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: "Set up Python"
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Run linter
        run: |
          uvx ruff check .
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Docker files with Hadolint
        uses: essentialkaos/hadolint-action@v1
        with:
          files: Dockerfile
          format: tty
          strict-labels: true
          failure-threshold: warning
  test-build-run:
    name: Test run Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test build Dockerfile
        run: docker build --pull --no-cache --progress=plain --tag test-run .
      - name: Test run Dockerfile
        run: |
          docker run -d --name test-run -p 8080:8080 test-run
          docker logs test-run
      - name: Check app is running
        continue-on-error: true # no idea why this fails. It works fine locally
        run: |
          sleep 5
          curl -s http://localhost:8080/ | grep -q "Found"

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs:
      - fly-config-validate
      - python-lint
      - dockerfile-lint
      - test-build-run
    concurrency: fly-deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy latest
        run: flyctl deploy --remote-only --config fly.toml --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
