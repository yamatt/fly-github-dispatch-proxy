# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Test and Deploy
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/test-deploy.yml"
      - "*.py"
  workflow_run:
    workflows:
      - Auto-merge
    types:
      - completed
jobs:
  fly-config-validate:
    name: Validate Fly.io config
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate config
        run: flyctl config validate  --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  python-lint:
    name: Run Python linter
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Run linter
        run: |
          uv run ruff check .
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Docker files with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
  python-test:
    name: Test Python code
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Run tests
        run: |
          uv run pytest --maxfail=1 --disable-warnings -q
  test-build-run:
    name: Test run Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test build Dockerfile
        run: docker build --pull --no-cache --progress=plain --tag test-run .
      - name: Test run Dockerfile
        id: docker-image-serve
        background: true
        run: |
          docker run --name test-run \
            -p 8080:8080 \
            -e TRIGGER_AUTH_TOKEN=test-token-value \
            -e GITHUB_PAT=test-github-pat
            test-run
      - name: Check app is running
        run: |
          curl -s http://0.0.0.0:8080/ | grep -q "Found"
      - name: Stop Ollama
        cancel: docker-image-serve

  deploy:
    name: Deploy app
    runs-on: ubuntu-slim
    needs:
      - fly-config-validate
      - python-lint
      - python-test
      - dockerfile-lint
      - test-build-run
    concurrency: fly-deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy latest
        run: flyctl deploy --remote-only --config fly.toml --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
