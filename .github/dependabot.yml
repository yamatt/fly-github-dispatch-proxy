version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - yamatt
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - github-actions
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - yamatt
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - python
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - yamatt
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - docker
